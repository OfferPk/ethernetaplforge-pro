  <text x="70" y="505" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11">● Physical Layer: 10BASE-T1L (IEEE 802.3cg), 1.0 Vpp / 2.4 Vpp PAM3 Modulation</text>
  <text x="70" y="527" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Max Trunk Length: 1,000m (AWG 18 Type A) | Max Spurs: 200m per device</text>
  <text x="70" y="549" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Intrinsic Safety: IEC TS 60079-47 (2-WISE) simplifies hazardous zone validation</text>
