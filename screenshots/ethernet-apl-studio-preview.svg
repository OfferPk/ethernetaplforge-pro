  <!-- Terminal Preview -->
  <rect x="750" y="405" width="395" height="210" rx="8" fill="#060b13" stroke="#233758" stroke-width="1" />
  <text x="765" y="430" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-size="11">$ ./build/ethernet-apl-cli.py size --trunk 650</text>
  <text x="765" y="450" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">[OK] Trunk: 650m (Resistance: 28.6 Ω, Atten: 1.56 dB)</text>
  <text x="765" y="470" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">[OK] Switch Terminal V: 18.99V (Safety Margin: 33.44 dB)</text>
  <text x="765" y="490" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">[OK] 4 Spurs Validated under IEC TS 60079-47 (2-WISE)</text>
  <text x="765" y="510" fill="#00f2fe" font-family="JetBrains Mono, monospace" font-size="11">$ ./build/ethernet-apl-cli.py roi --devices 100</text>
  <text x="765" y="530" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10">Capex Savings: $48,500 | Comm Time: -65.0 hrs</text>
